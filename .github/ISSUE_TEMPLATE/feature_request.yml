name: Feature or rule request
description: Suggest a new feature, or a change to the writing rules.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the feature or the rule change.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Before and after example
      description: For a rule change, show an answer before and after the change.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions that you considered.
